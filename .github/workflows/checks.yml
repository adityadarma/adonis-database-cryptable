name: test
on:
  - push
  - workflow_call

jobs:
  tests:
    name: adonis v${{ matrix.adonis }} | node ${{ matrix.node-version }} | ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AdonisJS v6 + Lucid v21
          - adonis: 6
            os: ubuntu-latest
            node-version: 20.x
          - adonis: 6
            os: ubuntu-latest
            node-version: 22.x
          - adonis: 6
            os: windows-latest
            node-version: 22.x
          # AdonisJS v7 + Lucid v22 (requires node >=24)
          - adonis: 7
            os: ubuntu-latest
            node-version: 24.x
          - adonis: 7
            os: windows-latest
            node-version: 24.x
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Install AdonisJS v7 peers
        if: matrix.adonis == 7
        run: npm install --no-save @adonisjs/core@^7.0.0 @adonisjs/lucid@^22.0.0 @adonisjs/assembler@^8.0.0 @vinejs/vine@^4.0.0
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
